[project]
name = "supportapi"
version = "1.0.0"
description = "API REST para gerenciamento de chamados de suporte com JWT e autorizacao por roles (USER/ADMIN)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyjwt>=2.8",
    "sqlalchemy>=2.0",
    "bcrypt>=4.2.0",
    "sqlalchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
